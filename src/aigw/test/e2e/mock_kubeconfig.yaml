apiVersion: v1
clusters:
- cluster:
    server: http://127.0.0.1:18080
    insecure-skip-tls-verify: true
  name: mock-cluster
contexts:
- context:
    cluster: mock-cluster
    user: mock-user
    namespace: vllm
  name: mock-context
current-context: mock-context
kind: Config
preferences: {}
users:
- name: mock-user
  user:
    token: mock-token
